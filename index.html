<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalkulatorische Kosten – Installateur</title><style>body{font-family:Arial,sans-serif;background:#f5f7f8;color:#18323b;margin:0}.wrap{max-width:760px;margin:auto;padding:24px 18px}.hero{background:#176b87;color:#fff;border-radius:22px;padding:26px}.card{background:#fff;border:1px solid #d9e1e4;border-radius:18px;padding:24px;margin-top:18px}.bar{height:8px;background:#dfe7e9;border-radius:9px;margin:18px 0}.fill{height:100%;background:#176b87;border-radius:9px;width:10%}.opt{display:block;width:100%;text-align:left;padding:15px;margin:10px 0;border:1px solid #d9e1e4;border-radius:13px;background:#fff;font-size:16px;cursor:pointer}.opt:hover{border-color:#176b87}.fb{margin-top:18px;padding:15px;border-radius:13px;background:#eaf5f7}.next{margin-top:14px;border:0;background:#176b87;color:white;padding:12px 18px;border-radius:11px;font-weight:bold;cursor:pointer}.small{color:#66777e;font-size:14px}.hero .small{color:#fff}h1{margin:4px 0 8px}h2{font-size:25px}.result{text-align:center}.score{font-size:48px;font-weight:bold}
.revealWrap{margin-top:18px;background:#fff;border:1px solid #d9e1e4;border-radius:18px;padding:18px}.revealHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.revealHead strong{font-size:18px}.tiles{position:relative;display:grid;grid-template-columns:repeat(5,1fr);aspect-ratio:5/4;border-radius:14px;overflow:hidden;background:#dcecf1}.scene{position:absolute;inset:0}.scene svg{width:100%;height:100%;display:block}.tile{position:relative;z-index:2;border:1px solid rgba(255,255,255,.75);background:#000;color:#fff;font-size:26px;font-weight:bold;display:flex;align-items:center;justify-content:center;transition:opacity .45s,transform .45s;min-width:0}.tile.revealed{opacity:0;pointer-events:none;transform:scale(1.05)}.revealNote{margin:10px 0 0;color:#66777e;font-size:13px;text-align:center}.tiles:after{content:'';position:absolute;left:20%;right:20%;bottom:0;height:24%;background:#000;z-index:3;pointer-events:none}.complete .tiles:after{display:none}.complete{background:#eaf7ef;border-color:#b9e3c8}.complete .revealNote{color:#1b7a45;font-weight:bold}@media(max-width:620px){.wrap{padding:14px 10px}.hero{padding:20px}.card{padding:18px}.revealWrap{padding:12px}.tile{font-size:18px}.revealHead{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><header class="hero"><div class="small">Einzelquiz · Berufsschule</div><h1>Kalkulatorische Kosten</h1><div>Für Installateurinnen und Installateure – mit Beispielen aus dem Berufsalltag.</div></header><div class="bar"><div id="fill" class="fill"></div></div><main id="app"></main><p style="text-align:center;color:#66777e;font-size:13px">Kein Name und keine Registrierung erforderlich.</p></div><script>
const qs=[
['Eine Installationsfirma besitzt eine Rohrpressmaschine. Die Maschine verliert durch Nutzung jedes Jahr an Wert. Welche kalkulatorische Kostenart berücksichtigt diesen Werteverzehr?',['Kalkulatorische AfA','Kalkulatorische Zinsen','Kalkulatorischer Unternehmerlohn','Kalkulatorische Wagnisse'],0,'Die kalkulatorische AfA berücksichtigt den Werteverzehr von Anlagegütern wie Maschinen und Werkzeugen.'],
['Der Inhaber eines kleinen Installationsbetriebs arbeitet selbst täglich auf Baustellen mit, erhält dafür aber keinen normalen Lohn wie ein angestellter Monteur. Welche kalkulatorische Kostenart berücksichtigt seine Arbeitsleistung?',['Kalkulatorische Zinsen','Kalkulatorischer Unternehmerlohn','Kalkulatorische AfA','Kalkulatorische Wagnisse'],1,'Der kalkulatorische Unternehmerlohn bewertet die Arbeitsleistung des Unternehmers.'],
['Ein Installationsbetrieb hat eigenes Kapital in Werkstatt, Fahrzeugen und Maschinen gebunden. Welche kalkulatorische Kostenart berücksichtigt die Nutzung dieses Kapitals?',['Kalkulatorische Wagnisse','Kalkulatorische AfA','Kalkulatorische Zinsen','Kalkulatorischer Unternehmerlohn'],2,'Kalkulatorische Zinsen berücksichtigen die Nutzung des im Betrieb eingesetzten Kapitals.'],
['Ein Installateur lässt bei der Montage ein Waschbecken fallen. Dadurch entsteht ein unerwarteter Schaden. Welche kalkulatorische Kostenart berücksichtigt solche betrieblichen Risiken?',['Kalkulatorische Wagnisse','Kalkulatorische AfA','Kalkulatorische Zinsen','Kalkulatorischer Unternehmerlohn'],0,'Kalkulatorische Wagnisse berücksichtigen bestimmte betriebliche Risiken und mögliche daraus entstehende Verluste.'],
['Material kostet 1.200 €, Löhne 800 € und kalkulatorische Kosten 300 €. Der Kunde bezahlt 2.500 €. Wie hoch ist der kalkulierte Gewinn?',['200 €','500 €','700 €','1.300 €'],0,'2.500 € − 1.200 € − 800 € − 300 € = 200 € Gewinn.'],
['Warum sollte ein Installationsbetrieb kalkulatorische Kosten bei der Auftragskalkulation berücksichtigen?',['Damit nur Materialkosten berücksichtigt werden','Damit der Auftrag wirtschaftlich realistisch beurteilt werden kann','Damit automatisch mehr Aufträge hereinkommen','Damit die Arbeitszeit der Monteure entfällt'],1,'Kalkulatorische Kosten helfen, die wirtschaftliche Belastung eines Auftrags realistischer zu beurteilen.'],
['Ein Auftrag wird zunächst nur mit Material und Monteurlöhnen kalkuliert. Maschinen, Risiken und die Arbeitsleistung des Unternehmers werden nicht berücksichtigt. Was kann passieren?',['Der tatsächliche Gewinn kann überschätzt werden','Der Umsatz wird automatisch niedriger','Die Materialkosten verschwinden aus der Rechnung','Der Auftrag wird automatisch teurer'],0,'Wenn relevante Kosten fehlen, kann der Auftrag profitabler erscheinen, als er wirtschaftlich tatsächlich ist.'],
['Welche Zuordnung passt zu einem Installationsbetrieb?',['Maschinen-Werteverzehr → kalkulatorische AfA','Arbeitsleistung des Unternehmers → kalkulatorische Zinsen','Eigenes Kapital → kalkulatorische Wagnisse','Betriebliches Risiko → kalkulatorischer Unternehmerlohn'],0,'Der Werteverzehr von Maschinen wird durch die kalkulatorische AfA berücksichtigt.'],
['Eine Heizungsinstallation wird für 8.000 € verkauft. Die gesamten ermittelten Kosten betragen 7.200 €. Wie hoch ist der Gewinn?',['200 €','800 €','1.200 €','7.200 €'],1,'8.000 € − 7.200 € = 800 € Gewinn.'],
['Ein Installationsbetrieb möchte entscheiden, ob er einen Auftrag zu einem bestimmten Preis annimmt. Warum ist eine vollständige Kostenrechnung wichtig?',['Sie zeigt, ob der Auftrag unter Berücksichtigung aller relevanten Kosten wirtschaftlich sinnvoll ist.','Sie garantiert, dass der Kunde den Auftrag annimmt.','Sie macht Material und Arbeitszeit kostenlos.','Sie ersetzt die Arbeitsplanung auf der Baustelle.'],0,'Eine vollständige Kostenrechnung zeigt, ob der Preis die relevanten Kosten deckt und einen angemessenen Gewinn ermöglicht.']];
let i=0,score=0,done=false;const app=document.getElementById('app'),fill=document.getElementById('fill');
let revealed=Array(10).fill(false);
function sceneSVG(){return `<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" aria-label="Installationswerkstatt mit Waschbecken und Werkzeug"><rect width="500" height="400" fill="#eef6f7"/><rect y="285" width="500" height="115" fill="#d8e3e6"/><rect x="25" y="35" width="450" height="250" rx="14" fill="#f9fbfb" stroke="#a7b8bd" stroke-width="4"/><path d="M40 85h420M40 135h420M40 185h420M40 235h420" stroke="#d2dde0" stroke-width="3"/><path d="M95 285V215h95v70" fill="#fff" stroke="#176b87" stroke-width="6"/><path d="M115 215v-38h55v38M125 177v-35h35v35" fill="none" stroke="#176b87" stroke-width="7" stroke-linecap="round"/><path d="M135 142c0-22 35-22 35 0" fill="none" stroke="#1ca36d" stroke-width="6"/><rect x="300" y="80" width="105" height="150" rx="12" fill="#fff" stroke="#9ab0b8" stroke-width="5"/><circle cx="352" cy="128" r="30" fill="#e8f3f5" stroke="#176b87" stroke-width="7"/><path d="M352 128l15-13M352 128l-3 20" stroke="#176b87" stroke-width="5" stroke-linecap="round"/><path d="M290 245h130" stroke="#176b87" stroke-width="7" stroke-linecap="round"/><path d="M240 255l38-55 12 8-38 55z" fill="#f2c39b" stroke="#233746" stroke-width="3"/><circle cx="246" cy="260" r="18" fill="#f2c39b"/><path d="M220 275h105" stroke="#233746" stroke-width="8" stroke-linecap="round"/><path d="M245 275v-35M285 275v-35" stroke="#233746" stroke-width="7"/><circle cx="65" cy="65" r="18" fill="#1ca36d"/><path d="M57 65l6 6 11-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="322" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#176b87">INSTALLATIONS-WERKSTATT</text><text x="250" y="365" text-anchor="middle" font-family="Arial" font-size="25" font-weight="800" fill="#176b87">KOSTEN-PROFI</text></svg>`}\nfunction revealHTML(){let n=revealed.filter(Boolean).length;return `<section class="revealWrap ${n===10?'complete':''}"><div class="revealHead"><strong>🧩 Dein Bild entsteht …</strong><span class="small">${n} von 10 Teilen aufgedeckt</span></div><div class="tiles"><div class="scene">${sceneSVG()}</div>${Array.from({length:10},(_,k)=>`<button class="tile ${revealed[k]?'revealed':''}" aria-label="Bildteil ${k+1}" disabled>${revealed[k]?'':'?'}</button>`).join('')}</div><div class="revealNote">${n===10?'🎉 Geschafft! Du hast das vollständige Bild aufgedeckt.':'Jede richtige Antwort deckt ein weiteres Bildteil auf.'}</div></section>`}
function render(){done=false;fill.style.width=((i+1)/10*100)+'%';let q=qs[i];app.innerHTML='<section class="card"><div class="small">Frage '+(i+1)+' von 10</div><h2>'+q[0]+'</h2><div id="opts"></div><div id="fb"></div></section>'+revealHTML();q[1].forEach((x,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=x;b.onclick=()=>answer(n);document.getElementById('opts').appendChild(b)})}
function answer(n){if(done)return;done=true;let q=qs[i],correct=n===q[2];if(correct){score++;revealed[i]=true}document.querySelectorAll('.opt').forEach(x=>x.disabled=true);let f=document.getElementById('fb');f.className='fb';f.innerHTML=(correct?'✓ Richtig! ':'✗ Noch nicht. ')+q[3]+'<br>'+ (correct?'<strong>🧩 Ein Bildteil wurde aufgedeckt!</strong><br>':'') +'<button class="next" id="next">'+(i<9?'Nächste Frage':'Ergebnis anzeigen')+'</button>';document.getElementById('next').onclick=()=>{if(i<9){i++;render()}else result()}}
function result(){fill.style.width='100%';let t=score>=9?'🏆 Kostenprofi!':score>=7?'⭐ Sehr gut!':score>=5?'👍 Schon ziemlich sicher!':'💡 Schau dir die Übersicht noch einmal an.';app.innerHTML='<section class="card result"><div class="small">Quiz abgeschlossen</div><h2>'+t+'</h2><div class="score">'+score+'/10</div><p>Du hast '+score+' von 10 Fragen richtig.</p></section>'+revealHTML()+'<section class="card result"><p>Du kannst das Quiz noch einmal versuchen und dein Ergebnis verbessern.</p><button class="next" id="restart">Quiz noch einmal starten</button></section>';document.getElementById('restart').onclick=()=>{i=0;score=0;revealed=Array(10).fill(false);render()}}
render();</script></body></html>
